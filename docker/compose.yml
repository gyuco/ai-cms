name: ai-cms

# Outbound HTTPS for services that need it goes through egress-proxy.
x-egress-env: &egress-env
  HTTPS_PROXY: http://egress-proxy:3128
  https_proxy: http://egress-proxy:3128
  NO_PROXY: localhost,127.0.0.1,postgres-core,postgres-prod,postgres-staging,s3,mailpit,cms-api,site-prod,site-staging,previews,builder,egress-proxy
  no_proxy: localhost,127.0.0.1,postgres-core,postgres-prod,postgres-staging,s3,mailpit,cms-api,site-prod,site-staging,previews,builder,egress-proxy
  NODE_USE_ENV_PROXY: '1'

x-postgres: &postgres
  image: postgres:17-alpine
  restart: unless-stopped
  healthcheck:
    test: ['CMD-SHELL', 'pg_isready -U postgres']
    interval: 5s
    timeout: 5s
    retries: 20

services:
  postgres-core:
    <<: *postgres
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_core_admin
    secrets: [pg_core_admin, pg_core_owner, pg_core_api, pg_core_worker, pg_core_site_ro]
    volumes:
      - pg-core:/var/lib/postgresql/data
      - ../packages/db/sql/roles.sql:/docker-entrypoint-initdb.d/05-roles.sql:ro
      - ./postgres/init-core.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    # prod and staging: the site runtimes read published content (role site_content_ro).
    networks: [control, prod, staging]

  postgres-prod:
    <<: *postgres
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_prod_admin
      APP_DB: app_prod
      SECRET_PREFIX: pg_prod
    secrets: [pg_prod_admin, pg_prod_owner, pg_prod_app]
    volumes:
      - pg-prod:/var/lib/postgresql/data
      - ./postgres/init-app.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    networks: [prod]

  postgres-staging:
    <<: *postgres
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_staging_admin
      APP_DB: app_staging
      SECRET_PREFIX: pg_staging
    secrets: [pg_staging_admin, pg_staging_owner, pg_staging_app]
    volumes:
      - pg-staging:/var/lib/postgresql/data
      - ./postgres/init-app.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    networks: [staging]

  s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/entrypoint-cms.sh']
    secrets: [s3_access_key, s3_secret_key]
    volumes:
      - s3-data:/data
      - ./s3/entrypoint.sh:/entrypoint-cms.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [control, prod, staging]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [control]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [cms-api, site-prod, site-staging, previews]
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [public, control, prod, staging]

  cms-api:
    image: ai-cms/cms-api
    build:
      context: ..
      dockerfile: docker/images/cms-api.Dockerfile
    restart: unless-stopped
    environment:
      <<: *egress-env
      CORE_DB_HOST: postgres-core
      S3_ENDPOINT: http://s3:8333
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
    secrets:
      [
        pg_core_owner,
        pg_core_api,
        session_secret,
        ai_keys_master,
        revalidate_token,
        s3_access_key,
        s3_secret_key,
      ]
    depends_on:
      postgres-core: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3100/_cms/api/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [control, prod, staging]

  worker:
    image: ai-cms/worker
    build:
      context: ..
      dockerfile: docker/images/worker.Dockerfile
    restart: unless-stopped
    environment:
      CORE_DB_HOST: postgres-core
      PROD_DB_HOST: postgres-prod
      STAGING_DB_HOST: postgres-staging
      S3_ENDPOINT: http://s3:8333
      BUILDER_URL: http://builder:8090
    secrets:
      [
        pg_core_worker,
        pg_prod_owner,
        pg_staging_owner,
        pg_staging_app,
        builder_token,
        revalidate_token,
        s3_access_key,
        s3_secret_key,
      ]
    volumes:
      - git-repos:/data/git
      - workspaces:/data/workspaces
      - releases:/data/releases
      - backups:/data/backups
    depends_on:
      postgres-core: { condition: service_healthy }
      postgres-prod: { condition: service_healthy }
      postgres-staging: { condition: service_healthy }
    networks: [control, prod, staging]

  site-prod:
    image: ai-cms/site-runtime
    build:
      context: ..
      dockerfile: docker/images/site-runtime.Dockerfile
    restart: unless-stopped
    environment:
      <<: *egress-env
      CMS_ENV: prod
      CORE_DB_HOST: postgres-core
      APP_DB_HOST: postgres-prod
      S3_ENDPOINT: http://s3:8333
    secrets: [pg_core_site_ro, pg_prod_app, revalidate_token]
    healthcheck: &site-health
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [prod]

  site-staging:
    image: ai-cms/site-runtime
    restart: unless-stopped
    environment:
      <<: *egress-env
      CMS_ENV: staging
      CORE_DB_HOST: postgres-core
      APP_DB_HOST: postgres-staging
      S3_ENDPOINT: http://s3:8333
    secrets: [pg_core_site_ro, pg_staging_app, revalidate_token]
    healthcheck: *site-health
    networks: [staging]

  agent-runner:
    image: ai-cms/agent-runner
    build:
      context: ..
      dockerfile: docker/images/agent-runner.Dockerfile
    restart: unless-stopped
    environment:
      <<: *egress-env
      # Agent sessions, authz decisions, AI gateway and MCP server: all in cms-api.
      CMS_API_URL: http://cms-api:3100
    volumes:
      - workspaces:/data/workspaces
      - cli-auth:/cli-auth
    depends_on:
      cms-api: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8070/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
    # Serves http://agent-runner:8070 to cms-api and worker. No prod network, no secrets and
    # no API keys: see TECHNICAL §3.1 and §7.
    networks: [control]

  # Changeset checks and builds (E11.2). It runs AI-written site code, so it holds no platform
  # secret: only the token the worker uses to call it. Workspaces are read-only; the internet
  # is reachable only through egress-proxy.
  builder:
    image: ai-cms/builder
    build:
      context: ..
      dockerfile: docker/images/builder.Dockerfile
    restart: unless-stopped
    environment:
      <<: *egress-env
      BUILDER_CONCURRENCY: '1'
    secrets: [builder_token]
    volumes:
      - workspaces:/data/workspaces:ro
      - artifacts:/data/artifacts
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8090/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [staging]

  # Changeset previews (E10.9): caddy routes cs-<id>.localhost here; one `next start` per
  # changeset on the artifact written by the builder. No platform secret: the site connects to
  # the changeset database with the site_app URL found in preview.json.
  previews:
    image: ai-cms/previews
    build:
      context: ..
      dockerfile: docker/images/previews.Dockerfile
    restart: unless-stopped
    environment:
      <<: *egress-env
      CORE_DB_HOST: postgres-core
      S3_ENDPOINT: http://s3:8333
      PREVIEW_PASSTHROUGH_ENV: CORE_DB_HOST,S3_ENDPOINT
    volumes:
      - artifacts:/data/artifacts:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/__previews/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [staging]

  egress-proxy:
    image: ai-cms/egress-proxy
    build:
      context: ..
      dockerfile: docker/images/egress-proxy.Dockerfile
    restart: unless-stopped
    environment:
      EGRESS_ALLOW: ${EGRESS_ALLOW:-.anthropic.com,.claude.ai,.claude.com,registry.npmjs.org}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3128/ 2>&1 | grep -q 405']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [egress, control, prod, staging]

# Service networks are internal: nothing reaches the internet except through
# egress-proxy, which only tunnels HTTPS to allowlisted hosts (FR-111).
networks:
  control:
    internal: true
  prod:
    internal: true
  staging:
    internal: true
  egress:
  public:

volumes:
  pg-core:
  pg-prod:
  pg-staging:
  git-repos:
  workspaces:
  releases:
  artifacts:
  backups:
  s3-data:
  cli-auth:
  caddy-data:

secrets:
  pg_core_admin: { file: ./secrets/pg_core_admin }
  pg_core_owner: { file: ./secrets/pg_core_owner }
  pg_core_api: { file: ./secrets/pg_core_api }
  pg_core_worker: { file: ./secrets/pg_core_worker }
  pg_core_site_ro: { file: ./secrets/pg_core_site_ro }
  pg_prod_admin: { file: ./secrets/pg_prod_admin }
  pg_prod_owner: { file: ./secrets/pg_prod_owner }
  pg_prod_app: { file: ./secrets/pg_prod_app }
  pg_staging_admin: { file: ./secrets/pg_staging_admin }
  pg_staging_owner: { file: ./secrets/pg_staging_owner }
  pg_staging_app: { file: ./secrets/pg_staging_app }
  s3_access_key: { file: ./secrets/s3_access_key }
  s3_secret_key: { file: ./secrets/s3_secret_key }
  session_secret: { file: ./secrets/session_secret }
  ai_keys_master: { file: ./secrets/ai_keys_master }
  revalidate_token: { file: ./secrets/revalidate_token }
  builder_token: { file: ./secrets/builder_token }
